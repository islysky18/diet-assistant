<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nutrition goals')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('nutrition')}"></header>

<main class="page-shell page-shell--narrow">
    <div class="page-heading">
        <div>
            <p class="page-heading__eyebrow">Daily targets</p>
            <h1>Nutrition Goals</h1>
            <p class="page-heading__description">Choose the daily targets you want to use when reviewing your nutrition progress.</p>
        </div>
    </div>

    <p class="alert" th:if="${successMessage}" th:text="${successMessage}"></p>

    <section class="card">
        <p class="medical-note">Nutrition needs vary from person to person. These are user-selected tracking goals and are not medical advice.</p>
        <form class="form-grid section-spaced--small" th:action="@{/nutrition-goals}" th:object="${nutritionGoalRequest}" method="post">
            <div class="form-field form-field--full">
                <label for="dailyCalories">Daily calories</label>
                <input id="dailyCalories" type="number" th:field="*{dailyCalories}" min="0" step="0.01" required>
                <p class="field-error" th:if="${#fields.hasErrors('dailyCalories')}" th:errors="*{dailyCalories}"></p>
            </div>
            <div class="form-field">
                <label for="dailyProteinGrams">Daily protein (g)</label>
                <input id="dailyProteinGrams" type="number" th:field="*{dailyProteinGrams}" min="0" step="0.01" required>
                <p class="field-error" th:if="${#fields.hasErrors('dailyProteinGrams')}" th:errors="*{dailyProteinGrams}"></p>
            </div>
            <div class="form-field">
                <label for="dailyCarbohydrateGrams">Daily carbohydrates (g)</label>
                <input id="dailyCarbohydrateGrams" type="number" th:field="*{dailyCarbohydrateGrams}" min="0" step="0.01" required>
                <p class="field-error" th:if="${#fields.hasErrors('dailyCarbohydrateGrams')}" th:errors="*{dailyCarbohydrateGrams}"></p>
            </div>
            <div class="form-field form-field--full">
                <label for="dailyFatGrams">Daily fat (g)</label>
                <input id="dailyFatGrams" type="number" th:field="*{dailyFatGrams}" min="0" step="0.01" required>
                <p class="field-error" th:if="${#fields.hasErrors('dailyFatGrams')}" th:errors="*{dailyFatGrams}"></p>
            </div>
            <div class="form-actions">
                <button type="submit" th:text="${hasNutritionGoal ? 'Update nutrition goals' : 'Set nutrition goals'}"></button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
