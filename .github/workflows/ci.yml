name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pinned image runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/image-runtime/Dockerfile
          load: true
          tags: diet-assistant-image-runtime:test
          cache-from: type=gha,scope=image-runtime
          cache-to: type=gha,mode=max,scope=image-runtime

      - name: Verify ImageMagick and HEIC decode
        run: docker run --rm diet-assistant-image-runtime:test verify-image-runtime

      - name: Prepare Maven cache directory
        run: mkdir -p "$RUNNER_TEMP/m2"

      - name: Run tests in pinned image runtime
        run: >-
          docker run --rm
          --add-host=host.docker.internal:host-gateway
          --env TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal
          --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "${{ github.workspace }}:/workspace"
          --volume "${{ runner.temp }}/m2:/root/.m2"
          diet-assistant-image-runtime:test
          ./mvnw --batch-mode test
