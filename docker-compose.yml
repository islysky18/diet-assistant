services:
  mysql:
    image: mysql:8.4
    container_name: diet-assistant-mysql
    environment:
      MYSQL_DATABASE: ${DIET_ASSISTANT_DB_NAME}
      MYSQL_USER: ${DIET_ASSISTANT_DB_USERNAME}
      MYSQL_PASSWORD: ${DIET_ASSISTANT_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DIET_ASSISTANT_DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u \"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
